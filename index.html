  <style>
    /* ——— schermata d'avvio ———
       Disegnata subito, prima di app.css e app.js. Le immagini in avvio/ sono foto di questa stessa schermata,
       così il passaggio dall'immagine di iOS alla pagina non fa scatti. Misure solo in % e vw (niente safe-area). */
    #boot { position: fixed; inset: 0; z-index: 9999; overflow: hidden; pointer-events: auto;
      background: linear-gradient(180deg, #1b1d4a 0%, #2c2b66 22%, #5e3576 42%, #b04a74 60%, #e9787a 74%, #f9a982 86%, #fcd3a0 100%);
      transition: opacity .7s cubic-bezier(.32, .72, 0, 1); }
    #boot > * { position: absolute; }
    #boot .bt-stars { inset: 0 0 auto 0; width: 100%; height: 60%; }
    #boot .bt-sun { left: 50%; bottom: 40vw; width: 64vw; height: 64vw; margin-left: -32vw; border-radius: 50%;
      background: linear-gradient(180deg, #fff6df 0%, #ffe0a8 45%, #ffb47a 100%);
      box-shadow: 0 0 0 4vw rgba(255, 214, 160, .10), 0 0 0 10vw rgba(255, 200, 150, .07), 0 0 26vw 6vw rgba(255, 170, 130, .45);
      -webkit-mask: linear-gradient(#000 0 58%, transparent 58% 60.5%, #000 60.5% 67%, transparent 67% 70.5%, #000 70.5% 76.5%, transparent 76.5% 81%, #000 81% 86%, transparent 86% 91.5%, #000 91.5%);
              mask: linear-gradient(#000 0 58%, transparent 58% 60.5%, #000 60.5% 67%, transparent 67% 70.5%, #000 70.5% 76.5%, transparent 76.5% 81%, #000 81% 86%, transparent 86% 91.5%, #000 91.5%);
      transition: transform 1s cubic-bezier(.32, .72, 0, 1); }
    #boot .bt-mt { left: 0; bottom: 0; width: 100%; height: auto; transition: transform 1s cubic-bezier(.32, .72, 0, 1); }
    #boot .bt-txt { left: 0; right: 0; top: max(40vw, calc((100% - 104vw) / 2 - 18vw)); text-align: center; color: #fff4e6; position: absolute; transition: transform 1s cubic-bezier(.32, .72, 0, 1), opacity .5s; }
    #boot .bt-txt > * { display: block; }
    #boot .bt-kicker { font: 600 3.1vw/1 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; letter-spacing: .42em; text-transform: uppercase; color: #ffc9d6; opacity: .9; padding-left: .42em; }
    #boot .bt-jp { font: 600 25vw/1.08 "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "Shippori Mincho", serif; margin-top: 3.2vw; letter-spacing: .06em; padding-left: .06em;
      text-shadow: 0 .6vw 4vw rgba(40, 10, 60, .45); }
    #boot .bt-title { font: 700 6.4vw/1.1 -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; letter-spacing: .02em; margin-top: 2.6vw; }
    #boot .bt-title i { font-style: normal; color: #ffc9d6; font-weight: 500; }
    #boot .bt-branch { right: 0; top: 0; width: 50vw; height: auto; transition: transform 1.1s cubic-bezier(.32, .72, 0, 1); }
    #boot .bt-petal { width: 3.4vw; height: 3.4vw; border-radius: 80% 0 80% 0; background: linear-gradient(135deg, #ffe3ec, #f7a6c0);
      box-shadow: 0 .2vw .6vw rgba(120, 30, 70, .25); opacity: .95; animation: bt-fall 6s linear both; }
    @keyframes bt-fall { 0% { transform: translate(0, 0) rotate(var(--r, 20deg)); }
      100% { transform: translate(-14vw, 72vh) rotate(calc(var(--r, 20deg) + 320deg)); opacity: 0; } }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot.out .bt-sun { transform: translateY(-6vw) scale(1.04); }
    #boot.out .bt-mt { transform: translateY(4vw); }
    #boot.out .bt-txt { transform: translateY(-4vw); opacity: 0; }
    #boot.out .bt-branch { transform: translate(6vw, -6vw); }
    /* schermi più bassi (iPhone SE, 8, 8 Plus): sole e scritta più piccoli */
    @media (min-aspect-ratio: 9/17) {
      #boot .bt-sun { width: 54vw; height: 54vw; margin-left: -27vw; bottom: 34vw; }
      #boot .bt-txt { top: 36vw; }
      #boot .bt-jp { font-size: 21vw; }
      #boot .bt-branch { width: 42vw; }
    }
    @media (orientation: landscape) and (max-height: 520px) { #boot { display: none; } }
    @media (prefers-reduced-motion: reduce) { #boot .bt-petal { animation: none; } }
